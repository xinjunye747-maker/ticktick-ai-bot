

name: TickTick AI Auto-Worker

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests google-genai
      - name: 运行脚本
        env:
          TICKTICK_TOKEN: ${{ secrets.TICKTICK_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ github.event.schedule == '0 0 * * *' && 'daily' || (github.event_name == 'schedule' && 'tasks' || 'all') }}
        run: python worker.py
      - name: Commit insights history
        if: always()
        run: |
          if [ -n "$(git status --porcelain insights_history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add insights_history.json
            git commit -m "chore: update insights_history.json [skip ci]"
            git push
          fi
